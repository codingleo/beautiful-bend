name: Validate skill
on: [push, pull_request]
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check structure and runner integrity
        run: |
          python3 scripts/coverage.py --check
          python3 scripts/validate.py --structure-only --report .validation/structure.json
          python3 -m unittest discover -s tests -v
      - name: Prepare locked source toolchain
        run: python3 scripts/setup_toolchain.py --directory "$RUNNER_TEMP/bend-tools" --report .validation/setup.json
      - name: Validate 100 cases and fixed-law mutations
        run: python3 scripts/validate.py --bend "$RUNNER_TEMP/bend-tools/bin/bend" --report .validation/results.json
      - name: Retain checker and runtime evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checker-js-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .validation/structure.json
            .validation/setup.json
            .validation/results.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  kernel:
    name: BendTT kernel
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Build pinned Lean and BendTT toolchain
        run: python3 scripts/setup_toolchain.py --directory "$RUNNER_TEMP/kernel-tools" --kernel --report .validation/kernel-setup.json
      - name: Verify every proof with the independent kernel
        run: >-
          python3 scripts/validate_kernel.py
          --bend "$RUNNER_TEMP/kernel-tools/bin/bend"
          --kernel "$RUNNER_TEMP/kernel-tools/bin/bendtt"
          --report .validation/kernel.json
      - name: Retain kernel evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bendtt-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .validation/kernel-setup.json
            .validation/kernel.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
